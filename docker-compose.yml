# Local stack. `docker compose up -d --build` runs everything; `docker compose up -d postgres seq mailpit`
# runs only the dependencies for `dotnet run`. Container names come from the compose project name,
# so several projects created from the template can coexist.
services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    build:
      context: .
      dockerfile: src/CleanArchitecture.Api/Dockerfile
    environment:
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=clean-architecture;Username=postgres;Password=postgres;Include Error Detail=true
      - Serilog__WriteTo__1__Args__ServerUrl=http://seq:5341
      - Smtp__Host=mailpit
    ports:
      - 5000:8080
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      mailpit:
        condition: service_started

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=clean-architecture
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clean-architecture"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:2026.1
    environment:
      - ACCEPT_EULA=Y
      # Local development only: disables the Seq login screen.
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq-data:/data
    ports:
      - 8081:80
      - 5341:5341

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - 8025:8025
      - 1025:1025

volumes:
  postgres-data:
  seq-data:
